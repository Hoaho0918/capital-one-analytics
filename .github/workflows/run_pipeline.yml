name: Run Data Pipeline

on:
  workflow_dispatch:

# Fixes the Node.js 20 deprecation warning across all runner tasks
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Fixed typo (removed the double 'python-')

    - name: Install Dependencies
      run: |
        pip install pandas pyarrow

    - name: Run Bronze Ingestion
      run: |
        python src/ingestion/file_loader.py

    - name: Commit Ingested Bronze Data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/bronze/
        git commit -m "data: automate bronze ingestion metadata addition" || echo "No changes to commit"
        git push
