version: 2

models:
  - name: stg_customer_profile
    description: "Staged client demographic profiles and qualitative attributes exactly matching the Customer group."
    columns:
      - name: customer_id
        description: "Primary key identifying the customer profile."
        data_tests:
          - unique
          - not_null

      - name: customer_age
        description: "Computed age of the profile owner."
        data_tests:
          - not_null

  - name: stg_account_activity
    description: "Staged operational financial ledgers, transactional cash flows, and activity timelines."
    columns:
      - name: account_id
        description: "Primary key for the banking or investment account."
        data_tests:
          - unique
          - not_null

      - name: current_balance
        description: "Net cash balance currently resting in the account ledger."
        data_tests:
          - not_null

      - name: activity_date
        description: "The primary chronological anchor timestamp for time-series partitioning."
        data_tests:
          - not_null

  - name: stg_loan_application_summary
    description: "Staged risk evaluation parameters, behavioral profile traits, and approval statuses."
    columns:
      - name: customer_id
        description: "Foreign key mapping back to the customer profile master record."
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customer_profile')
              field: customer_id

      - name: loan_approval_status
        description: "Current adjudication state of the credit request. Evaluated in strict uppercase formats."
        data_tests:
          - accepted_values:
              values: ['APPROVED', 'DENIED', 'PENDING']
