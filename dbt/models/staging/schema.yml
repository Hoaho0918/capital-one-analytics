version: 2

models:
  - name: stg_customer_profile
    description: "Staged client demographic profiles and qualitative risk tolerance parameters."
    columns:
      - name: customer_id
        description: "Primary key identifying the customer profile."
        data_tests:
          - unique
          - not_null

      - name: customer_age
        description: "Computed age of the profile owner."
        data_tests:
          - not_null

      - name: risk_tolerance_tier
        description: "Assessed risk classification tier."
        data_tests:
          - accepted_values:
              values: ['Low', 'Medium', 'High', 'Speculation']

  - name: stg_account_activity
    description: "Staged operational financial ledgers and localized cash thresholds."
    columns:
      - name: account_id
        description: "Primary key for the banking or investment account."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key mapping back to the customer profile master record."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customer_profile')
              field: customer_id

      - name: current_balance
        description: "Net cash balance currently resting in the account ledger."
        data_tests:
          - not_null

  - name: stg_loan_application_summary
    description: "Staged risk evaluation data containing credit terms, application statuses, and debt repayments."
    columns:
      - name: customer_id
        description: "Primary key for the loan application matching back to the customer."
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customer_profile')
              field: customer_id

      - name: loan_approval_status
        description: "Current adjudication state of the credit request."
        data_tests:
          - accepted_values:
              values: ['Approved', 'Denied', 'Pending']
